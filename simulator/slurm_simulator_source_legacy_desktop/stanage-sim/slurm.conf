# =====================================================================
# Stanage HPC cluster - 1:1 replication for the Slurm simulator
# Source: https://docs.hpc.shef.ac.uk/en/latest/stanage/cluster_specs.html


ClusterName=stanage
SlurmctldHost=node001
SlurmUser=root

AuthType=auth/none
CredType=cred/none
MpiDefault=none
ProctrackType=proctrack/pgid
ReturnToService=2
SwitchType=switch/none
TaskPlugin=task/affinity
# Trust slurm.conf node specs instead of the (single) simulated slurmd's
# real hardware, so node001 is not drained for "low" cpu/memory.
SlurmdParameters=config_overrides
GresTypes=gpu

SlurmctldPort=6817
SlurmdPort=6818
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
StateSaveLocation=/opt/slurm-sim/var/spool/slurmctld
SlurmdSpoolDir=/opt/slurm-sim/var/spool/slurmd
PluginDir=/opt/slurm-sim/lib/slurm

InactiveLimit=0
KillWait=30
MinJobAge=30
SlurmctldTimeout=120
SlurmdTimeout=0
Waittime=0

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU
PriorityType=priority/basic

AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none
JobCompType=jobcomp/none

SlurmctldDebug=info
SlurmdDebug=info
SlurmctldLogFile=/opt/slurm-sim/etc/slurmctld.log
SlurmSchedLogFile=/opt/slurm-sim/etc/sched.log
SlurmSchedLogLevel=1

# ---------------------------------------------------------------------
# Node definitions (Ice Lake = Intel Xeon 8358 64c; EPYC 7413 48c;
# Sapphire Rapids = Intel Xeon 8468 96c). Memory in MB (available).
# ---------------------------------------------------------------------
# 142 standard CPU nodes: 64 cores, 251 GB
NodeName=node[001-142] NodeAddr=127.0.1.[1-142] CPUs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=257024 State=UNKNOWN
# 12 large memory nodes: 64 cores, 1 TB
NodeName=bigmem[01-12] NodeAddr=127.0.2.[1-12] CPUs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=1031168 State=UNKNOWN
# 12 very large memory nodes: 64 cores, 2 TB
NodeName=hugemem[01-12] NodeAddr=127.0.3.[1-12] CPUs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=2062336 State=UNKNOWN
# 13 A100 GPU nodes: 48 cores, 512 GB, 4x NVIDIA A100
NodeName=gpua100[01-13] NodeAddr=127.0.4.[1-13] CPUs=48 Sockets=2 CoresPerSocket=24 ThreadsPerCore=1 RealMemory=515088 Gres=gpu:a100:4 State=UNKNOWN
# 6 H100 GPU nodes: 48 cores, 512 GB, 2x NVIDIA H100
NodeName=gpuh100[01-06] NodeAddr=127.0.5.[1-6] CPUs=48 Sockets=2 CoresPerSocket=24 ThreadsPerCore=1 RealMemory=515088 Gres=gpu:h100:2 State=UNKNOWN
# 4 H100-NVL GPU nodes: 96 cores, 512 GB, 4x NVIDIA H100 NVL
NodeName=gpuh100nvl[01-04] NodeAddr=127.0.6.[1-4] CPUs=96 Sockets=2 CoresPerSocket=48 ThreadsPerCore=1 RealMemory=515040 Gres=gpu:h100nvl:4 State=UNKNOWN

# ---------------------------------------------------------------------
# Partitions (names follow Stanage's public partitions where known:
# standard, gpu, gpu-h100; the memory and h100-nvl partitions are named
# for clarity of routing in the simulation).
# ---------------------------------------------------------------------
PartitionName=standard     Nodes=node[001-142]    Default=YES MaxTime=96:00:00 State=UP
PartitionName=bigmem       Nodes=bigmem[01-12]                MaxTime=96:00:00 State=UP
PartitionName=hugemem      Nodes=hugemem[01-12]               MaxTime=96:00:00 State=UP
PartitionName=gpu          Nodes=gpua100[01-13]               MaxTime=96:00:00 State=UP
PartitionName=gpu-h100     Nodes=gpuh100[01-06]               MaxTime=96:00:00 State=UP
PartitionName=gpu-h100-nvl Nodes=gpuh100nvl[01-04]            MaxTime=96:00:00 State=UP
