# Stanage 2025 Slurm simulator configuration.
#
# Observed facts from Fred's 2025 queue archive:
#   node001-node150, node201-node212, node301-node312
#   gpu01-gpu18, gpu21-gpu26, gpu31-gpu34 (202 nodes total)
#
# CPU/GPU models, cores, memory, and devices per GPU node are working
# assumptions inherited from the earlier project configuration. They must be
# confirmed with Fred before hardware-level energy results are reported.

ClusterName=stanage_2025
SlurmctldHost=node001
SlurmUser=root

AuthType=auth/none
CredType=cred/none
MpiDefault=none
ProctrackType=proctrack/pgid
ReturnToService=2
SwitchType=switch/none
TaskPlugin=task/affinity
SlurmdParameters=config_overrides
GresTypes=gpu

SlurmctldPort=6817
SlurmdPort=6818
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
StateSaveLocation=/opt/slurm-sim/var/spool/slurmctld
SlurmdSpoolDir=/opt/slurm-sim/var/spool/slurmd
PluginDir=/opt/slurm-sim/lib/slurm

InactiveLimit=0
KillWait=30
MinJobAge=30
SlurmctldTimeout=120
SlurmdTimeout=0
Waittime=0

SchedulerType=sched/backfill
SchedulerParameters=batch_sched_delay=0,default_queue_depth=10000,bf_interval=30,bf_max_job_start=1000,bf_max_job_test=10000
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
PriorityType=priority/basic

AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none
JobCompType=jobcomp/none

SlurmctldDebug=info
SlurmdDebug=info
SlurmctldLogFile=/opt/slurm-sim/etc/slurmctld.log
SlurmSchedLogFile=/opt/slurm-sim/etc/sched.log
SlurmSchedLogLevel=1

# Observed CPU node ranges; capacities are pending confirmation.
NodeName=node[001-150] NodeAddr=127.0.1.[1-150] CPUs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=257024 State=UNKNOWN
NodeName=node[201-212] NodeAddr=127.0.2.[1-12] CPUs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=1031168 State=UNKNOWN
NodeName=node[301-312] NodeAddr=127.0.3.[1-12] CPUs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=2062336 State=UNKNOWN

# Observed GPU node ranges; hardware labels and capacities are inferred.
NodeName=gpu[01-18] NodeAddr=127.0.4.[1-18] CPUs=48 Sockets=2 CoresPerSocket=24 ThreadsPerCore=1 RealMemory=515088 Gres=gpu:a100:4 State=UNKNOWN
NodeName=gpu[21-26] NodeAddr=127.0.5.[1-6] CPUs=48 Sockets=2 CoresPerSocket=24 ThreadsPerCore=1 RealMemory=515088 Gres=gpu:h100:2 State=UNKNOWN
NodeName=gpu[31-34] NodeAddr=127.0.6.[1-4] CPUs=96 Sockets=2 CoresPerSocket=48 ThreadsPerCore=1 RealMemory=515040 Gres=gpu:h100nvl:4 State=UNKNOWN

# Partition membership is observed in the allocation logs. High-priority
# variants are mapped to their underlying hardware partition by the generator.
PartitionName=interactive       Nodes=node[001-002]                         MaxTime=08:00:00 State=UP
PartitionName=sheffield         Nodes=node[003-150,201-212,301-312] Default=YES MaxTime=4-00:00:00 State=UP
PartitionName=sheffield-8xlong  Nodes=node[003-150,201-212,301-312]             MaxTime=8-00:00:00 State=UP
PartitionName=gpu               Nodes=gpu[01-18]                            MaxTime=4-00:00:00 State=UP
PartitionName=gpu-h100          Nodes=gpu[21-26]                            MaxTime=4-00:00:00 State=UP
PartitionName=gpu-h100-nvl      Nodes=gpu[31-34]                            MaxTime=4-00:00:00 State=UP
